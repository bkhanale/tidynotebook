<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Notesapp: offline notes with versioned history."
    />
    <meta name="theme-color" content="#1a1b26" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Notesapp</title>
    <script>
      // Apply the saved theme before the first paint so the page never
      // flashes the wrong palette. The values mirror packages/ui tokens.
      try {
        var stored = localStorage.getItem('notesapp.theme') || 'system';
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.background = dark ? '#1a1b26' : '#e1e2e7';
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body
    class="m-0 bg-app font-sans text-ui leading-relaxed text-ink antialiased"
  >
    <div id="root" class="min-h-dvh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
