<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Tidy Notebook install icon</title>
  <!-- Tile is Default light accentFill (#1a1917) and the mark is Default dark
    textStrong (#f5f4f2). The registry in packages/ui/src/themes owns both
    values. This file copies them because an install icon cannot read CSS. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#1a1917"/>
  <g stroke="#f5f4f2" stroke-linecap="round" fill="none">
    <g stroke-width="44">
      <line x1="178" y1="148" x2="178" y2="340"/>
      <line x1="334" y1="148" x2="334" y2="340"/>
      <line x1="178" y1="148" x2="334" y2="340"/>
    </g>
    <line x1="178" y1="404" x2="334" y2="404" stroke-width="32"/>
  </g>
</svg>
