<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Diagram preview</title>
    <style>
      /* Tokyo Night palettes for the isolated diagram frame. The frame runs
         with an opaque origin and reads no parent stylesheet, so the two
         values per token repeat the design table here. */
      :root {
        color-scheme: light dark;
      }
      [data-theme='dark'] {
        color-scheme: dark;
        --notes-bg: #1a1b26;
        --notes-surface: #16161e;
        --notes-text: #c0caf5;
        --notes-accent: #7aa2f7;
        --notes-border: #6b7499;
      }
      [data-theme='light'] {
        color-scheme: light;
        --notes-bg: #e1e2e7;
        --notes-surface: #d0d5e3;
        --notes-text: #3760bf;
        --notes-accent: #2e7de9;
        --notes-border: #5a6a8a;
      }
      body {
        background: var(--notes-bg);
        color: var(--notes-text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.5;
        margin: 0;
        padding: 8px;
      }
      .notes-diagram-error {
        margin: 4px 0;
      }
      .notes-diagram-source {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="notes-diagram-host"></div>
    <script type="module">
      import { startDiagramFrame } from './frame.ts';
      startDiagramFrame();
    </script>
  </body>
</html>
