# Compose override that gives the application a mail transport as one URL.
#
# docker/compose.mail.yaml takes the same transport as separate fields, which
# need no percent encoding. Use this file only to keep one SMTP URL. Name it
# after the main one:
#
#   COMPOSE_FILE=docker-compose.yml:docker/compose.mail-url.yaml
#
# The URL holds a password, so it is a secret file and never a value in
# `.env`. Write it, for example `smtps://user:password@smtp.example.com:465`,
# to `smtp_url` in NOTESAPP_SECRETS_DIR with mode 0600 and owner uid 10001. A
# reserved character in the user name or the password must be percent
# encoded, for example `@` as `%40`. Set NOTESAPP_MAIL_FROM in `.env`.
services:
  app:
    environment:
      NOTESAPP_SMTP_URL_FILE: /run/secrets/smtp_url
      NOTESAPP_MAIL_FROM: ${NOTESAPP_MAIL_FROM:?Set NOTESAPP_MAIL_FROM in .env. It names the sender of every message, for example Tidy Notebook <no-reply@notes.example.com>.}
    secrets:
      - smtp_url

secrets:
  smtp_url:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/smtp_url
