# Disposable PostgreSQL service for storage and row access integration tests.
#
# This file is for local checks only. It is not a deployment. The service binds
# a non default host port, so it cannot collide with an installed PostgreSQL.
# The image is pinned by digest, as the design requires.
#
# `POSTGRES_USER` is the migration role. It owns the schema and runs the
# migrations. The migration creates the runtime role `notesapp_app`, and the
# migration command sets that role's password from `NOTESAPP_RUNTIME_PASSWORD`.
# Both passwords below are test values of a throwaway local service.
services:
  postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: notesapp_migrate
      POSTGRES_PASSWORD: notesapp_migrate_test
      POSTGRES_DB: notesapp_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notesapp_migrate -d notesapp_test -q']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
