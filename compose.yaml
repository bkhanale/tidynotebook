# Production Compose file for one NotesApp instance.
services:
  postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-notesapp}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notesapp} -q',
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: notesapp:latest
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOTESAPP_DATABASE_URL_FILE: /run/secrets/migration_database_url
      NOTESAPP_RUNTIME_PASSWORD_FILE: /run/secrets/runtime_database_password
      NOTESAPP_AUTH_PASSWORD_FILE: /run/secrets/auth_database_password
    secrets:
      - migration_database_url
      - runtime_database_password
      - auth_database_password
    command:
      [
        'node',
        'server/node_modules/@notesapp/storage-server/dist/migrate.js',
        '--profile',
        'deploy',
      ]
    networks:
      - database

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: notesapp:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NOTESAPP_ORIGIN: ${NOTESAPP_ORIGIN:-http://localhost:3000}
      NOTESAPP_DATABASE_URL_FILE: /run/secrets/runtime_database_url
      NOTESAPP_AUTH_DATABASE_URL_FILE: /run/secrets/auth_database_url
      NOTESAPP_STORAGE_ROOT: /var/lib/notesapp
      NOTESAPP_AUTH_SECRET_FILE: /run/secrets/auth_secret
      NOTESAPP_ALLOWED_HOSTS: ${NOTESAPP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      NOTESAPP_LOG_LEVEL: ${NOTESAPP_LOG_LEVEL:-info}
      NOTESAPP_MAX_BODY_BYTES: ${NOTESAPP_MAX_BODY_BYTES:-1048576}
      NOTESAPP_MAX_HEADER_BYTES: ${NOTESAPP_MAX_HEADER_BYTES:-16384}
      NOTESAPP_REQUEST_TIMEOUT_MS: ${NOTESAPP_REQUEST_TIMEOUT_MS:-5000}
      NOTESAPP_HOST: 0.0.0.0
      NOTESAPP_PORT: 3000
    secrets:
      - runtime_database_url
      - auth_database_url
      - auth_secret
    ports:
      - '${NOTESAPP_BIND_HOST:-0.0.0.0}:${NOTESAPP_PORT:-3000}:3000'
    volumes:
      - storage_data:/var/lib/notesapp
    networks:
      - database
      - frontend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  storage_data:

networks:
  database:
    internal: true
  frontend:

secrets:
  postgres_password:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/postgres_password
  migration_database_url:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/migration_database_url
  runtime_database_password:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/runtime_database_password
  auth_database_password:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/auth_database_password
  runtime_database_url:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/runtime_database_url
  auth_database_url:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/auth_database_url
  auth_secret:
    file: ${NOTESAPP_SECRETS_DIR:-./.secrets}/auth_secret
