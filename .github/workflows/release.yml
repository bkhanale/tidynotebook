name: Release

# A push of a `v*` tag builds the deployment image and pushes it to the GitHub
# Container Registry. This is the one workflow that publishes. `ci.yml` runs
# the gate on a push to `main` and on a pull request, and `dco.yml` checks the
# sign-off of each commit of a pull request. Before the tag, the before gate of
# record 0204 builds the image from the prepare commit, so this build repeats a
# build that already passed.
on:
  push:
    tags:
      - 'v*'

# The job reads the source and writes one package (the container image).
permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the image
    # A named runner image, so a move of ubuntu-latest does not change the
    # build between two releases (record 0204).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The registry path is lowercase, as the registry requires.
      IMAGE: ghcr.io/tidynotebook/tidynotebook
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive the version from the tag
        # `v0.1.0` becomes the image tag `0.1.0`. The tag drives the version,
        # so nothing in the repository has to name it.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Sign in to the registry
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          docker build \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=$VERSION" \
            .

      - name: Push the image
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
