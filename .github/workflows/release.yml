name: Release core

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize all image aliases. A late main run also checks the current main SHA.
concurrency:
  group: release-core
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release source
    if: github.repository == 'tidynotebook/tidynotebook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require source proof and release protection
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
        run: node tools/release-workflow.mjs

  build:
    name: Build and prove ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the native image with the shared cache
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx build --load --provenance=false --platform "linux/$ARCH" \
            --cache-from "type=registry,ref=ghcr.io/tidynotebook/tidynotebook/ci-cache:$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/tidynotebook/tidynotebook" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$VERSION" --tag "notesapp:$ARCH" .
      - name: Prove target sources and notices
        env:
          NOTESAPP_IMAGE: notesapp:${{ matrix.arch }}
        run: node --test tests/image/distribution-notices.test.ts
      - name: Save the proved image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "notesapp:$ARCH" --output "$RUNNER_TEMP/image-$ARCH.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish_main:
    name: Publish main image
    needs: [prepare, build]
    if: needs.prepare.outputs.version == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Only an approved main source can reach this job.
      - uses: ./.github/actions/publish-core # zizmor: ignore[self-repository]
        with:
          version: ${{ needs.prepare.outputs.version }}
          sha: ${{ needs.prepare.outputs.sha }}

  publish_release:
    name: Publish version image
    needs: [prepare, build]
    if: needs.prepare.outputs.version != 'main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # The source and environment gates both passed before publication.
      - uses: ./.github/actions/publish-core # zizmor: ignore[self-repository]
        with:
          version: ${{ needs.prepare.outputs.version }}
          sha: ${{ needs.prepare.outputs.sha }}
