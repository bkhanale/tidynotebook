name: Publish proved core images
description: Publish the two tested image archives and attest their index.
inputs:
  version:
    description: Validated stable version or main
    required: true
  sha:
    description: Proved source commit
    required: true
  amd64-artifact-id:
    description: Proved amd64 artifact id
    required: true
  amd64-artifact-digest:
    description: Proved amd64 artifact digest
    required: true
  arm64-artifact-id:
    description: Proved arm64 artifact id
    required: true
  arm64-artifact-digest:
    description: Proved arm64 artifact digest
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Recheck source proof after approval
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.sha }}
      run: node tools/release-workflow.mjs
    - name: Require the pinned runner image copy tooling
      shell: bash
      run: |
        command -v skopeo
        skopeo --version
        test "$(skopeo --version)" = "skopeo version 1.13.3"
        command -v unzip
    - name: Verify and extract the exact build artifacts
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.sha }}
        AMD64_ARTIFACT_ID: ${{ inputs.amd64-artifact-id }}
        AMD64_ARTIFACT_DIGEST: ${{ inputs.amd64-artifact-digest }}
        ARM64_ARTIFACT_ID: ${{ inputs.arm64-artifact-id }}
        ARM64_ARTIFACT_DIGEST: ${{ inputs.arm64-artifact-digest }}
      run: node tools/download-core-artifacts.mjs
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Publish the tested images without a rebuild
      id: publish
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.sha }}
        GH_TOKEN: ${{ github.token }}
      run: node tools/publish-core.mjs
    - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-name: ghcr.io/tidynotebook/core
        subject-digest: ${{ steps.publish.outputs.digest }}
        push-to-registry: true
