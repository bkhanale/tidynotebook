name: Image smoke
description: Build amd64 with registry cache and test the image commands.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Prepare disposable Compose inputs and registry cache
      shell: bash
      env:
        CACHE_WRITE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: node tools/ci-image.mjs
    - name: Build amd64 with registry cache
      shell: bash
      run: docker compose -f docker-compose.yml -f "$RUNNER_TEMP/ci-image.yaml" build
    - shell: bash
      run: node --test tests/image/
