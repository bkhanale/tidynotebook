name: Image smoke
description: Build amd64 with Actions cache and test the image commands.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: ./.github/actions/cache-runtime # zizmor: ignore[self-repository]
    - name: Prepare disposable Compose inputs and Actions cache
      shell: bash
      env:
        CACHE_WRITE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: node tools/ci-image.mjs
    - name: Build amd64 with Actions cache
      shell: bash
      run: |
        docker compose version
        node tools/ci-cache.mjs compose
    - shell: bash
      run: node --test tests/image/
