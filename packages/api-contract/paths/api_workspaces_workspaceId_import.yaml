post:
  operationId: importWorkspace
  summary: Import a portable workspace zip archive.
  description: >-
    Reads Markdown files and image files at their archive paths. The
    operation does not rewrite a Markdown reference. Every imported path
    must be free in the workspace. The gap between two chunks of the
    archive is bounded, so a sender that stops in the middle is answered
    and does not hold its slot.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
  requestBody:
    $ref: '../components/requestBodies/ImportWorkspace.yaml'
  responses:
    '200':
      $ref: '../components/responses/WorkspaceImported.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '408':
      $ref: '../components/responses/RequestTimeout.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
