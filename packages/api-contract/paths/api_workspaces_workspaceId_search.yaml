get:
  operationId: searchFiles
  summary: Search accepted live notes in a workspace.
  description: >-
    Searches accepted titles and Markdown content with the PostgreSQL
    simple text configuration. Deleted files and historic revisions are
    excluded.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/SearchQuery.yaml'
    - $ref: '../components/parameters/SearchLimit.yaml'
  responses:
    '200':
      $ref: '../components/responses/SearchResults.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
