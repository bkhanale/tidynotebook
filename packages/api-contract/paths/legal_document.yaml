get:
  operationId: getLegalDocument
  summary: Read one legal document of the installation.
  description: >-
    Answers the terms or the privacy notice as one HTML document that the
    server builds from the Markdown file of the operator, with the one
    sanitized renderer (record 0140). The page holds no script, and its only
    style sheet is the built style sheet of the application. The operation
    declares an empty security requirement, so a person reads the documents
    before they have an account. A document that the operator names by an
    external address, or does not name, answers not found.
  tags:
    - legal
  security: []
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/LegalDocumentName.yaml'
  responses:
    '200':
      $ref: '../components/responses/LegalPage.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
