get:
  operationId: getRootHealth
  summary: Report that the service process is running, at the root address.
  description: >-
    Serves the same answer as the liveness operation at the API address. A
    load balancer and an orchestrator usually probe a fixed root path, so the
    service answers that address too. The server calls one implementation for
    both addresses, so the two answers cannot disagree. Reports process
    liveness only, and never inspects a dependency.
  tags:
    - service
  security: []
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
  responses:
    '200':
      $ref: '../components/responses/Health.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
