description: >-
  Too many requests. Too many attempts were made in a short time, the
  account runs its limit of archive jobs, or the account or the
  installation downloaded the most bytes or read the most objects that one
  calendar month in UTC allows (record 0193). The code names the cause:
  rate_limited, archive_job_running or download_limit. Nothing changed.
headers:
  retry-after:
    description: The seconds after which the caller may try again.
    schema:
      type: string
      maxLength: 16
content:
  application/problem+json:
    schema:
      $ref: '../schemas/ProblemDetails.yaml'
