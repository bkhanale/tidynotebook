description: >-
  The service cannot do this work now: it runs as many jobs of this kind as
  it can, or a failure of the service stopped the work. The code names the
  cause.
headers:
  retry-after:
    description: The seconds after which the caller may try again.
    schema:
      type: string
      maxLength: 16
content:
  application/problem+json:
    schema:
      $ref: '../schemas/ProblemDetails.yaml'
