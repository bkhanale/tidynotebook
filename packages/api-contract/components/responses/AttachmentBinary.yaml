description: Binary bytes of the immutable attachment.
headers:
  content-disposition:
    description: >-
      Names the file and states what the client does with the bytes. An image
      of an accepted type is shown, and every other type is saved.
    schema:
      type: string
      maxLength: 1024
content:
  image/png:
    schema:
      type: string
      format: binary
  image/jpeg:
    schema:
      type: string
      format: binary
  image/gif:
    schema:
      type: string
      format: binary
  image/webp:
    schema:
      type: string
      format: binary
