type: object
description: >-
  One part of a search excerpt. A part with `marked` true is a word that
  the query matched. The excerpt quotes the text that a reader sees, with
  no Markdown mark and no link address, and it carries no markup, so a
  reader renders every part as text and decides itself how a marked part
  looks.
additionalProperties: false
required:
  - text
  - marked
properties:
  text:
    type: string
    readOnly: true
    maxLength: 1024
  marked:
    type: boolean
    readOnly: true
