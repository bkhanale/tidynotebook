type: object
description: >-
  Settings to store for the signed in account. A member that the body
  leaves out keeps its stored value, so a client changes one setting
  without the others.
additionalProperties: false
minProperties: 1
properties:
  appearance:
    allOf:
      - $ref: './Appearance.yaml'
    description: The appearance choice to store.
  themeFamily:
    allOf:
      - $ref: './ThemeFamily.yaml'
    description: The theme family to store.
  spellCheck:
    type: boolean
    description: Whether the editor checks the spelling of a note.
