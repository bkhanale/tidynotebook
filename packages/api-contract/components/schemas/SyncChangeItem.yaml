type: object
description: One commit ordered incremental change record.
additionalProperties: false
required:
  - cursor
  - entityKind
  - entityId
  - revisionId
  - deleted
properties:
  cursor:
    type: string
    readOnly: true
    description: The commit ordered position of this change.
    minLength: 1
    maxLength: 32
    pattern: ^[0-9]+$
  entityKind:
    type: string
    readOnly: true
    description: The kind of entity that the record refers to.
    enum:
      - file
      - membership
  entityId:
    $ref: './Uuid.yaml'
  revisionId:
    oneOf:
      - $ref: './Uuid.yaml'
      - type: 'null'
    readOnly: true
    description: The revision of a file change, or null otherwise.
  deleted:
    type: boolean
    readOnly: true
    description: Whether the change deletes its entity.
