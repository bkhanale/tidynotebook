type: object
description: >-
  One immutable revision. Its identity, its parents, and its content
  never change after acceptance.
additionalProperties: false
required:
  - revisionId
  - fileId
  - path
  - kind
  - deleted
  - parents
  - digest
  - size
  - text
  - document
  - epoch
  - merged
  - attachmentObjectId
  - message
  - restoredFrom
  - clientTime
  - serverTime
properties:
  revisionId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: Identifier of this revision.
  fileId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: The file that this revision belongs to.
  path:
    allOf:
      - $ref: './FilePath.yaml'
    readOnly: true
    description: The path of the file at this revision.
  kind:
    allOf:
      - $ref: './FileKind.yaml'
    readOnly: true
    description: Whether this revision holds Markdown or an attachment.
  deleted:
    type: boolean
    readOnly: true
    description: True for a tombstone, which is how a deletion is recorded.
  parents:
    type: array
    readOnly: true
    description: >-
      The parents of this revision, in submitted order. A first revision
      has none, a normal revision has one, and an explicit merge has two.
    maxItems: 2
    items:
      $ref: './Uuid.yaml'
  digest:
    allOf:
      - $ref: './ContentDigest.yaml'
    readOnly: true
    description: Digest of the content of this revision.
  size:
    type: integer
    readOnly: true
    description: Size of the content in bytes.
    minimum: 0
  text:
    oneOf:
      - $ref: './MarkdownText.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The Markdown of this revision, or null for an attachment revision.
  attachmentObjectId:
    oneOf:
      - $ref: './Uuid.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The immutable attachment object of this revision, or null for a
      Markdown revision. Its bytes are transferred separately.
  message:
    allOf:
      - $ref: './CheckpointMessage.yaml'
    readOnly: true
    description: The checkpoint name of this revision, or null.
  restoredFrom:
    oneOf:
      - $ref: './Uuid.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The historic revision that this one restored, or null. A restore
      never rewinds history; it adds a revision.
  clientTime:
    type: string
    readOnly: true
    description: >-
      The clock of the device that wrote the revision. It stays
      informational, because a device clock cannot be trusted.
    format: date-time
    maxLength: 64
  serverTime:
    type: string
    readOnly: true
    description: Instant at which the workspace accepted the revision.
    format: date-time
    maxLength: 64
  document:
    oneOf:
      - $ref: './DocumentUpdate.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The whole document of the note at this revision, so a reader can
      start from it and stay able to merge later work. Null for an
      attachment revision, and for a file read that asked for the text
      alone.
  epoch:
    oneOf:
      - $ref: './DocumentEpoch.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The generation of that document, or null for an attachment
      revision.
  merged:
    type: boolean
    readOnly: true
    description: >-
      True when the save that made this revision joined work that its device
      had not seen. Every device reads the mark in History, and the device
      that saved keeps its own checkpoint for Review.
