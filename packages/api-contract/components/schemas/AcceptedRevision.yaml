type: object
description: >-
  One revision as the workspace accepted it. The record carries the
  values that the workspace assigned, and no note text: the client that
  wrote the revision already holds its content, and an actor that may
  write but not read must not receive content through a write answer.
additionalProperties: false
required:
  - revisionId
  - fileId
  - parents
  - path
  - deleted
  - digest
  - size
  - actorAccountId
  - serverTime
  - message
  - epoch
  - acceptedState
  - merged
properties:
  revisionId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: Identifier of the accepted revision.
  fileId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: The file that the revision belongs to.
  parents:
    type: array
    readOnly: true
    description: The parents of the revision, in submitted order.
    maxItems: 2
    items:
      $ref: './Uuid.yaml'
  path:
    allOf:
      - $ref: './FilePath.yaml'
    readOnly: true
    description: The accepted path, in its normalized form.
  deleted:
    type: boolean
    readOnly: true
    description: True for a tombstone, which is how a deletion is recorded.
  digest:
    allOf:
      - $ref: './ContentDigest.yaml'
    readOnly: true
    description: Digest of the content of the revision.
  size:
    type: integer
    readOnly: true
    description: Size of the content in bytes.
    minimum: 0
  actorAccountId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: >-
      The account that the workspace recorded as the author. It comes
      from the verified request; a client cannot supply it.
  serverTime:
    type: string
    readOnly: true
    description: Instant at which the workspace accepted the revision.
    format: date-time
    maxLength: 64
  message:
    allOf:
      - $ref: './CheckpointMessage.yaml'
    readOnly: true
    description: The checkpoint name of the revision, or null.
  epoch:
    oneOf:
      - $ref: './DocumentEpoch.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The generation of the document that this revision holds, or null
      for an attachment revision.
  acceptedState:
    oneOf:
      - $ref: './DocumentObservedState.yaml'
      - type: 'null'
    readOnly: true
    description: >-
      The complete state of the document after acceptance. It states
      identities and deletions, and it holds no note text, so an actor
      that may write and not read learns nothing from it. Absent for an
      attachment revision, where it is null.
  merged:
    type: boolean
    readOnly: true
    description: >-
      True when this save joined work that the device had not seen. The
      device that saved keeps the checkpoint of that save for Review, and
      every device marks the revision in History.
