type: object
description: >-
  What a person gives to make an account. The address comes from the
  invitation.
additionalProperties: false
required:
  - invitation
  - password
properties:
  invitation:
    allOf:
      - $ref: './InvitationToken.yaml'
    description: The token from the invitation link.
  password:
    allOf:
      - $ref: './Password.yaml'
    description: The password of the new account.
  name:
    type: string
    description: The display name of the new account.
    minLength: 1
    maxLength: 256
