type: object
description: >-
  What the account sent in the current calendar month in UTC, and each
  limit of record 0193 that holds it now. A state is true past the limit of
  the account or past the cap of the installation, and it holds until
  endsAt.
additionalProperties: false
required:
  - month
  - endsAt
  - publishedTransferBytes
  - downloadBytes
  - publishedPagesClosed
  - downloadsPaused
  - uploadsPaused
  - imagesPaused
properties:
  month:
    allOf:
      - $ref: './UsageMonth.yaml'
    readOnly: true
    description: The month of the counts.
  endsAt:
    type: string
    format: date-time
    maxLength: 64
    readOnly: true
    description: >-
      The first instant of the next month in UTC, when every count starts
      again from zero.
  publishedTransferBytes:
    allOf:
      - $ref: './ByteCount.yaml'
    readOnly: true
    description: >-
      The bytes that the published pages of the account sent in the month.
  downloadBytes:
    allOf:
      - $ref: './ByteCount.yaml'
    readOnly: true
    description: The bytes that the account downloaded in the month.
  publishedPagesClosed:
    type: boolean
    readOnly: true
    description: >-
      Whether each published link of the account answers the closed page,
      past its published transfer limit or the published transfer cap of
      the installation.
  downloadsPaused:
    type: boolean
    readOnly: true
    description: >-
      Whether an export, an attachment and a sync snapshot answer
      download_limit, past the download limit of the account or the download
      cap of the installation.
  uploadsPaused:
    type: boolean
    readOnly: true
    description: >-
      Whether an upload and an import answer storage_busy, past the object
      write cap of the installation.
  imagesPaused:
    type: boolean
    readOnly: true
    description: >-
      Whether an attachment answers download_limit and a published page
      shows no image, past the object read cap of the installation.
