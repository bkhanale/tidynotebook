type: object
description: >-
  The one field of the password form of a published page. A served page
  holds no script, so the browser sends the field in the form encoding of
  HTML and the server reads one name from it.
additionalProperties: false
required:
  - password
properties:
  password:
    type: string
    writeOnly: true
    description: >-
      The password that the owner gave the link. Any value is accepted
      here and a wrong value answers the same page, so the answer states
      nothing about the link or about the password policy.
    minLength: 1
    maxLength: 512
