type: object
description: Ordered incremental changes after a cursor.
additionalProperties: false
required:
  - changes
  - nextCursor
properties:
  changes:
    type: array
    readOnly: true
    description: >-
      Ordered changes after the requested cursor, oldest first. The page
      holds whole commits only. One commit larger than the requested limit
      comes as one whole page, and a commit holds at most 1000 records.
    maxItems: 1000
    items:
      $ref: './SyncRecord.yaml'
  nextCursor:
    allOf:
      - $ref: './SyncCursorValue.yaml'
    readOnly: true
    description: The cursor the client sends to continue.
