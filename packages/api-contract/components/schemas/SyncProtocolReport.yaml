type: object
description: The sync protocol versions that push and pull accept.
additionalProperties: false
required:
  - versions
properties:
  versions:
    type: array
    readOnly: true
    description: >-
      Every served sync protocol version, oldest first. The list is never
      empty.
    minItems: 1
    uniqueItems: true
    items:
      type: integer
      minimum: 1
  notificationProtocols:
    type: array
    readOnly: true
    description: >-
      The notice stream subprotocols that this deployment opens now. The list
      is empty while this process cannot send notices. A server that omits the member predates
      the notice stream, so the client reads the feed on its own schedule.
    maxItems: 1
    uniqueItems: true
    items:
      $ref: './SyncNoticeProtocol.yaml'
