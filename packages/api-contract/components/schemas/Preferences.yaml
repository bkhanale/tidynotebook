type: object
description: Settings that follow one account to every device.
additionalProperties: false
required:
  - appearance
  - themeFamily
  - spellCheck
properties:
  appearance:
    allOf:
      - $ref: './Appearance.yaml'
    readOnly: true
    description: The stored appearance choice of the account.
  themeFamily:
    allOf:
      - $ref: './ThemeFamily.yaml'
    readOnly: true
    description: The stored theme family of the account.
  spellCheck:
    type: boolean
    readOnly: true
    description: >-
      True when the editor asks the browser to check the spelling of a
      note.
