type: object
description: The identifiers of a tombstone revision.
additionalProperties: false
required:
  - revisionId
  - mutationId
  - deviceId
properties:
  revisionId:
    allOf:
      - $ref: './Uuid.yaml'
    description: Identifier of the tombstone revision.
  mutationId:
    allOf:
      - $ref: './Uuid.yaml'
    description: Identity of this operation, which makes a retry safe.
  deviceId:
    allOf:
      - $ref: './DeviceId.yaml'
    description: The device that submitted the deletion.
  message:
    allOf:
      - $ref: './CheckpointMessage.yaml'
    description: Reason for the deletion, or null.
  document:
    allOf:
      - $ref: './DocumentSave.yaml'
    description: >-
      What the device had seen of the document when it deleted the note.
      The save carries no update. The workspace refuses the deletion when
      the state does not cover the text work that the note holds, so a
      deletion never hides an edit that the device never saw.
