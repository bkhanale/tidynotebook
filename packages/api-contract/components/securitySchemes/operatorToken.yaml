type: http
scheme: bearer
description: >-
  The one secret of the operator of the installation, from
  NOTESAPP_OPERATOR_TOKEN or from the file that NOTESAPP_OPERATOR_TOKEN_FILE
  names (records 0190 and 0207). A service of the operator sends it on each
  operator operation. The server compares it in constant time, and the
  attempt counters bound the failures. With no secret, every operator
  operation answers 404 with the code operator_off.
