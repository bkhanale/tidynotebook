        - checkpointName
        - restoredFrom
        - text
        - objectId
      properties:
        revisionId:
          $ref: '#/components/schemas/Uuid'
        fileId:
          $ref: '#/components/schemas/Uuid'
        path:
          $ref: '#/components/schemas/FilePath'
        deleted:
          type: boolean
        parents:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        digest:
          $ref: '#/components/schemas/ContentDigest'
        size:
          type: integer
        actorAccountId:
          $ref: '#/components/schemas/Uuid'
        clientTime:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        message:
          $ref: '#/components/schemas/CheckpointMessage'
        isCheckpoint:
          type: boolean
        checkpointName:
          $ref: '#/components/schemas/CheckpointMessage'
        restoredFrom:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        text:
          type:
            - string
            - 'null'
        objectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    HistoryPage:
