      required:
        - mutationId
        - deviceId
        - clientTime
        - targetRevisionId
        - revisionId
      properties:
        mutationId:
          $ref: '#/components/schemas/Uuid'
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        clientTime:
          type: string
          format: date-time
          minLength: 20
          maxLength: 64
        targetRevisionId:
          $ref: '#/components/schemas/Uuid'
        expectedHead:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        revisionId:
          $ref: '#/components/schemas/Uuid'
        path:
          $ref: '#/components/schemas/FilePath'
        message:
          $ref: '#/components/schemas/CheckpointMessage'
    RestoreFileInput:
      type: object
      description: Payload to bring one deleted file back into the file tree.
