        - canPurge
      properties:
        fileIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        revisionIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        contentDigests:
          type: array
          items:
            type: string
        attachmentObjectIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        blockingReferences:
          type: array
          items:
            $ref: '#/components/schemas/BlockingReference'
        dependentRevisionCount:
