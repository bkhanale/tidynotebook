openapi: 3.1.2
info:
  title: notesapp API
  version: 0.1.0
  summary: Application HTTP contract for notesapp.
  description: >-
    This document is the authoritative HTTP interface of notesapp. Every
    application HTTP call in the web app and the sync engine uses an operation
    generated from this document. Errors use RFC 9457 problem details with a
    stable application code.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: notesapp maintainers
    url: https://notesapp.invalid/support
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://notes.invalid
    description: >-
      Documentation placeholder origin. Every deployment sets its real origin
      through the client configuration, so no generated call depends on this
      value.
tags:
  - name: service
    description: Service state operations used by operators and load balancers.
  - name: accounts
    description: The signed in account and the settings that follow it.
  - name: workspaces
    description: Workspace containers for the single user's files.
  - name: files
    description: >-
      Files, their immutable revisions, and the atomic changesets that accept
      them.
  - name: auth
    description: >-
      Authentication protocol endpoints. Better Auth implements them; the
      contract records their shapes so the generated client owns every call.
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report that the service process is running.
      description: >-
        Reports process liveness only. The operation never inspects a
        dependency, so a caller cannot use it to decide that the service can
        accept traffic. Use the readiness operation for that decision.
      tags:
        - service
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/ready:
    get:
      operationId: getReadiness
      summary: Report whether the service can accept traffic.
      description: >-
        Reports the state of every startup requirement that the service can
        check. The current release validates configuration only, because no
        database or storage dependency exists yet. A later task adds a database
        check and a storage check to the same report.
      tags:
        - service
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Detail'
      responses:
        '200':
          $ref: '#/components/responses/Readiness'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/NotReady'
  /api/setup:
    get:
      operationId: getSetupStatus
      summary: Report whether the single user exists.
      description: Reports if first-run setup is complete without exposing account data.
      tags:
        - auth
      security: []
      responses:
        '200':
          description: The setup state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - initialized
                properties:
                  initialized:
                    type: boolean
                    readOnly: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createOwner
      summary: Create the single user during first-run setup.
      description: This operation is refused after the first account exists.
      tags:
        - auth
      security: []
      requestBody:
        description: The email address and password of the single user.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  minLength: 3
                  maxLength: 320
                password:
                  type: string
                  minLength: 12
                  maxLength: 512
      responses:
        '201':
          description: The single user was created and signed in.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - initialized
                properties:
                  initialized:
                    type: boolean
                    readOnly: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/account:
    get:
      operationId: getAccount
      summary: Report the signed in account and its settings.
      description: >-
        Reports the identifier of the signed in account, the address and the
        display name that the identity provider supplied, and the stored
        settings of that account.
      tags:
        - accounts
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/account/preferences:
    put:
      operationId: updatePreferences
      summary: Replace the stored settings of the signed in account.
      description: >-
        Replaces the settings that follow the account to every device. The
        theme family selects the palette, and the appearance selects the light
        variant, the dark variant, or the one that matches the device.
      tags:
        - accounts
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        $ref: '#/components/requestBodies/PreferencesUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: List every workspace of the signed in account.
      description: >-
        Lists the workspaces that the account is a member of, with the current
        role in each. An account never sees a workspace it does not belong to.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/WorkspaceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createWorkspace
      summary: Create a workspace owned by the signed in account.
      description: >-
        Creates a workspace whose only member is the account that created it,
        as its owner.
      tags:
        - workspaces
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        $ref: '#/components/requestBodies/WorkspaceName'
      responses:
        '201':
          $ref: '#/components/responses/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}:
    put:
      operationId: updateWorkspace
      summary: Rename a workspace.
      description: >-
        Renames a workspace. An owner or an administrator of that workspace may
        do this.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/WorkspaceName'
      responses:
        '200':
          $ref: '#/components/responses/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace and every record that belongs to it.
      description: >-
        Deletes a workspace and its complete content history. Only its owner
        may do this.
      tags:
        - workspaces
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          $ref: '#/components/responses/Removed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/files:
    get:
      operationId: listFiles
      summary: List the live files of a workspace.
      description: >-
        Lists the accepted files of the workspace in the requested order,
        paged with a keyset cursor. `updated` is the newest accepted change
        first and is the default; `path` is the order of the folder tree. A
        deleted file is not listed, because it holds no place in the file
        tree; its history stays readable through its revisions. The answer
        carries metadata only, so a file tree can be drawn without downloading
        any note.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/FileSort'
      responses:
        '200':
          $ref: '#/components/responses/FileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createFile
      summary: Create a file with its first revision.
      description: >-
        Creates a file that does not exist yet, together with the first
        revision of its content. The client assigns the file, revision, and
        mutation identifiers, so a retry that lost its answer repeats the same
        operation instead of creating a second file. The answer carries a
        strong entity tag that names the accepted revision.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/CreateFile'
      responses:
        '201':
          $ref: '#/components/responses/FileChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/search:
    get:
      operationId: searchFiles
      summary: Search accepted live notes in a workspace.
      description: >-
        Searches accepted titles and Markdown content with the PostgreSQL
        simple text configuration. Deleted files and historic revisions are
        excluded.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          $ref: '#/components/responses/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/files/{fileId}:
    get:
      operationId: getFile
      summary: Read a file and the content of its accepted head.
      description: >-
        Reports the metadata of one live file and the Markdown of its accepted
        head revision. The answer carries a strong entity tag that names that
        revision, so a later conditional read answers 304 and a later
        conditional write answers 412 when the head has moved. If-None-Match
        with that tag, or with *, answers 304. A deleted file answers 404; its
        revisions stay readable.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/File'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: updateFile
      summary: Replace the content or the path of a file.
      description: >-
        Writes one revision of an existing file. The request must carry the
        entity tag of the head that the client saw in If-Match; a request
        without it, and a request that carries *, both answer 428, and a head
        that has moved answers 412. The request states the new text, the new
        path, or both; a member that is absent keeps the value of the expected
        head. The answer carries the accepted revision without its text.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/UpdateFile'
      responses:
        '200':
          $ref: '#/components/responses/FileChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteFile
      summary: Delete a file by writing a tombstone revision.
      description: >-
        Deletes one file. The deletion is a revision, so the history of the
        file stays complete and a later restore is possible. The tombstone
        carries no note text, and a submitted tombstone that carries Markdown
        is refused with 422, so a deletion can never add content. Deleting
        removes the file from search, so a workspace at its storage limit can
        still be tidied. The request must carry the entity tag of the head
        that the client saw.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/DeleteFile'
      responses:
        '200':
          $ref: '#/components/responses/FileChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/revisions/{revisionId}:
    get:
      operationId: getRevision
      summary: Read one immutable revision.
      description: >-
        Reports one accepted revision of the workspace with its parents, its
        path at that time, and its content. A Markdown revision carries its
        text. An attachment revision carries the identity of its immutable
        object; its bytes are transferred through the attachment operations.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          $ref: '#/components/responses/Revision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/changesets:
    post:
      operationId: commitChangeset
      summary: Accept one atomic change of one or more files.
      description: >-
        Accepts a complete changeset: every revision commits or none does. The
        request states an expected head for each file it changes, and null for
        a file that must not exist yet. It is the operation that the sync
        engine uses, and it also performs a folder change of up to 1000 files.
        A retry with the same mutation identity and the same body returns the
        first outcome; the same identity with a different body is refused.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/Changeset'
      responses:
        '200':
          $ref: '#/components/responses/AcceptedChangeset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload a temporary attachment image file.
      description: >-
        Uploads an image as multipart/form-data. The server stores the bytes in
        a temporary object, validates format, dimensions, and pixel count in an
        isolated worker, and computes the SHA-256 digest.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/UploadAttachment'
      responses:
        '201':
          $ref: '#/components/responses/AttachmentUploaded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/attachments/{objectId}/finalize:
    post:
      operationId: finalizeAttachment
      summary: Finalize an attachment object and create an immutable revision.
      description: >-
        Finalizes an uploaded temporary attachment object and commits an
        attachment revision to the workspace file tree in one transaction. An
        existing file requires an If-Match header naming the accepted head.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        $ref: '#/components/requestBodies/FinalizeAttachment'
      responses:
        '200':
          $ref: '#/components/responses/FileChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/attachments/{revisionId}:
    get:
      operationId: getAttachmentRevision
      summary: Read the binary image of an accepted attachment revision.
      description: >-
        Streams the immutable binary bytes of an accepted attachment revision
        with its declared media type.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          $ref: '#/components/responses/AttachmentBinary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/files/{fileId}/history:
    get:
      operationId: listHistory
      summary: Read the revision history of a file.
      description: >-
        Lists the immutable revisions of one file in reverse chronological
        order. The result supports cursor pagination. Each item reports byte
        size, author identity, checkpoint status, and restored-from references.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          $ref: '#/components/responses/HistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/files/{fileId}/restore:
    post:
      operationId: restoreRevision
      summary: Restore a file to a historic revision.
      description: >-
        Appends a child revision to the current accepted head referencing the
        historic target revision in restoredFrom, reusing existing content bytes
        without rewriting history.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        $ref: '#/components/requestBodies/RestoreRevision'
      responses:
        '200':
          $ref: '#/components/responses/AcceptedChangeset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/purge/preview:
    post:
      operationId: previewPurge
      summary: Preview permanent deletion of files.
      description: >-
        Reports affected revisions, reclaimable bytes, and blocking references
        such as attachments referenced by external revisions. Restricted to
        workspace owners.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/PreviewPurge'
      responses:
        '200':
          $ref: '#/components/responses/PurgePreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/purge:
    post:
      operationId: purgeFiles
      summary: Permanently delete files and write purge markers.
      description: >-
        Permanently purges files and revisions, writes purge markers, and
        reclaims storage. Subsequent writes to purged file identifiers answer
        410 Gone. Restricted to the workspace owner.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/PurgeFiles'
      responses:
        '200':
          $ref: '#/components/responses/PurgedFiles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/trash:
    get:
      operationId: listDeletedFiles
      summary: List the deleted files of a workspace.
      description: >-
        Lists the files of the workspace that a tombstone revision deleted,
        in the requested order and paged with a keyset cursor, exactly as the
        live listing is. A deleted file holds no place in the file tree, so it
        appears here instead. Each entry names the instant of the deletion and
        the tombstone that is the accepted head, which the restore operation
        needs. A permanently purged file is not listed, because nothing of it
        is left to restore.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FilePageCursor'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/FileSort'
      responses:
        '200':
          $ref: '#/components/responses/DeletedFileList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/trash/{fileId}/restore:
    post:
      operationId: restoreFile
      summary: Bring one deleted file back into the file tree.
      description: >-
        Writes one revision on top of the tombstone that un-deletes the file
        with the content of its last revision before the deletion. The
        tombstone is the expected head, so a change that arrived after the
        deletion answers 412 and nothing is written. The file keeps its
        identifier, so every link to it and its whole history stay valid.
        The file goes back to the path it held before the deletion. If a live
        file already holds that path, the answer restores the file beside it
        under the name plus " (restored)" in the same folder, so a restore
        never overwrites live work. A file that is not deleted answers 404, and
        a permanently purged one answers 410.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        $ref: '#/components/requestBodies/RestoreFile'
      responses:
        '200':
          $ref: '#/components/responses/FileChange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/sync/snapshots:
    post:
      operationId: startSnapshot
      summary: Capture a consistent download snapshot of a workspace.
      description: >-
        Captures the accepted file metadata and the workspace high-water cursor
        in one repeatable-read transaction and materializes bounded metadata
        pages for 15 minutes. Each item names an immutable revision identifier;
        content transfer reuses the revision read by that identifier, never a
        later current head. The syncVersion names the sync protocol version;
        only version 1 is served and any other value is rejected without
        changing data.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/StartSnapshot'
      responses:
        '200':
          $ref: '#/components/responses/SnapshotStarted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/sync/snapshots/{token}:
    get:
      operationId: getSnapshotPage
      summary: Read one page of a materialized snapshot.
      description: >-
        Reads one page of the items that the snapshot captured. The page runs
        in its own short transaction and rechecks current access; no
        database transaction stays open across network pages. A missing token,
        an expired snapshot, and a snapshot that a purge invalidated all answer
        410 with the code snapshot_required: the client starts a fresh snapshot
        and keeps its local work.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SnapshotToken'
        - $ref: '#/components/parameters/SnapshotPosition'
        - $ref: '#/components/parameters/SnapshotPageLimit'
      responses:
        '200':
          $ref: '#/components/responses/SnapshotPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/SnapshotRequired'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/sync/changes:
    get:
      operationId: getChanges
      summary: Read ordered incremental changes after a cursor.
      description: >-
        Reads the commit ordered change records after a cursor the client
        already applied, oldest first. Every relevant write allocates its
        cursor under the workspace lock, so the stream cannot skip a file
        transaction that commits late. Change records are kept for 90 days; an
        older cursor
        answers 410 with the code snapshot_required, while saved revision
        identifiers stay valid beyond that window.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SyncCursor'
        - $ref: '#/components/parameters/SyncLimit'
      responses:
        '200':
          $ref: '#/components/responses/SyncChanges'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/SnapshotRequired'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/export:
    get:
      operationId: exportWorkspace
      summary: Download every live note and image as a zip archive.
      description: >-
        Streams a zip archive that holds every live note of the workspace as a
        Markdown file at its stored path, plus every live image at its stored
        path. A deleted file is not in the
        archive. Nothing in the archive needs this application to be read
        again, so it is also the cheapest disaster recovery.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          $ref: '#/components/responses/WorkspaceArchive'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/import:
    post:
      operationId: importWorkspace
      summary: Import a portable workspace zip archive.
      description: >-
        Reads Markdown files and image files at their archive paths. The
        operation does not rewrite a Markdown reference. Every imported path
        must be free in the workspace.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        $ref: '#/components/requestBodies/ImportWorkspace'
      responses:
        '200':
          $ref: '#/components/responses/WorkspaceImported'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/files/{fileId}/export:
    get:
      operationId: exportNote
      summary: Download one note as a Markdown file.
      description: >-
        Returns the accepted head of one note as Markdown, with a content
        disposition that names the file. A deleted note answers 404, because it
        holds no place in the file tree any more.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/NoteMarkdown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/workspaces/{workspaceId}/files/{fileId}/backlinks:
    get:
      operationId: listBacklinks
      summary: List notes that link to one live file.
      description: >-
        Reads the accepted path-based link index. Each result names the live
        note and revision that contains at least one link to this file.
      tags:
        - files
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/BacklinkList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: notesapp_session
      description: >-
        Browser session cookie. The cookie is HttpOnly and SameSite, and a
        cookie authenticated write also needs an origin check. A deployment
        whose origin is https serves the same cookie under the reserved name
        __Secure-notesapp_session and adds the Secure attribute, as the cookie
        prefix rules require.
  parameters:
    RequestId:
      name: x-request-id
      in: header
      required: false
      style: simple
      explode: false
      description: >-
        Optional caller supplied correlation identifier. The server echoes the
        value and generates a UUID when the header is absent. A value outside
        the pattern below is rejected with a 400 problem.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._-]+$
    Detail:
      name: detail
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Amount of readiness information to return. A summary report omits the
        detail text of each check.
      schema:
        type: string
        enum:
          - summary
          - full
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      style: simple
      explode: false
      description: Identifier of the workspace that the operation acts on.
      schema:
        $ref: '#/components/schemas/Uuid'
    FileId:
      name: fileId
      in: path
      required: true
      style: simple
      explode: false
      description: Identifier of the file that the operation acts on.
      schema:
        $ref: '#/components/schemas/Uuid'
    RevisionId:
      name: revisionId
      in: path
      required: true
      style: simple
      explode: false
      description: Identifier of the revision that the operation reads.
      schema:
        $ref: '#/components/schemas/Uuid'
    ObjectId:
      name: objectId
      in: path
      required: true
      style: simple
      explode: false
      description: Identifier of the attachment object that the operation acts on.
      schema:
        $ref: '#/components/schemas/Uuid'
    PageCursor:
      name: cursor
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Position to continue a listing from. Use the nextCursor value of the
        previous page. The first page names no cursor.
      schema:
        $ref: '#/components/schemas/Uuid'
    FilePageCursor:
      name: cursor
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Position to continue a file listing from. Use the nextCursor value of
        the previous page, together with the same sort. The first page names
        no cursor.
      schema:
        $ref: '#/components/schemas/FilePageToken'
    FileSort:
      name: sort
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Order of the listing. `updated` puts the newest accepted change first
        and is the default. `path` orders by the stored path, which is the
        order of the folder tree.
      schema:
        $ref: '#/components/schemas/FileSortOrder'
    PageLimit:
      name: limit
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Largest number of entries in one page. The server uses 100 when the
        parameter is absent and never returns more than 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    IfMatch:
      name: if-match
      in: header
      required: false
      style: simple
      explode: false
      description: >-
        The strong entity tag of the accepted head that the client saw, for
        example "3f1c2b7a-0e5d-4c1b-9a7e-2b6d4f8c1a03". A list of tags is
        accepted and the request proceeds when any of them names the current
        head. The operation needs a tag: a request without one answers 428, and
        a head that has moved answers 412. The parameter is declared optional
        so that the missing case reaches the documented 428 answer instead of a
        schema error. The value * is refused with 428 as well: it would permit
        a write against a state the client never read, which is the lost update
        that this precondition exists to prevent.
      schema:
        $ref: '#/components/schemas/EntityTagCondition'
    IfNoneMatch:
      name: if-none-match
      in: header
      required: false
      style: simple
      explode: false
      description: >-
        Entity tag that the client already holds, or a list of them. The answer
        is 304 with no body when one of them names the current head. The value *
        means any representation, so it answers 304 for a file that exists.
      schema:
        $ref: '#/components/schemas/EntityTagCondition'
    HistoryLimit:
      name: limit
      in: query
      required: false
      style: form
      explode: true
      description: Largest number of history items to return. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SearchQuery:
      name: query
      in: query
      required: true
      style: form
      explode: true
      description: Words to find in accepted note paths and Markdown content.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    SearchLimit:
      name: limit
      in: query
      required: false
      style: form
      explode: true
      description: Largest number of search results to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SnapshotToken:
      name: token
      in: path
      required: true
      style: simple
      explode: false
      description: >-
        Opaque token of a materialized snapshot, issued by the snapshot start
        operation. Only its hash is stored, so the value cannot be guessed.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: ^[A-Za-z0-9_-]{43}$
    SnapshotPosition:
      name: position
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Ordinal of the first snapshot item to return. Use the nextPosition
        value of the previous page. The first page starts at zero.
      schema:
        type: integer
        minimum: 0
    SnapshotPageLimit:
      name: limit
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Largest number of snapshot items in one page. The server uses the page
        size stored with the snapshot when the parameter is absent and never
        returns more than 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    SyncCursor:
      name: cursor
      in: query
      required: true
      style: form
      explode: true
      description: >-
        Commit ordered cursor the client already applied. The answer carries
        the records after this position, oldest first. A cursor that predates
        the retained 90 day window needs a fresh snapshot instead.
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: ^[0-9]+$
    SyncLimit:
      name: limit
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Largest number of change records in one answer. The server uses 100
        when the parameter is absent and never returns more than 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
  requestBodies:
    PreferencesUpdate:
      description: The settings to store for the signed in account.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PreferencesInput'
    WorkspaceName:
      description: The name to give the workspace.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceNameInput'
    CreateFile:
      description: The identifiers, the path, and the first content of a new file.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateFileInput'
    UpdateFile:
      description: The identifiers and the new content or path of a file.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateFileInput'
    DeleteFile:
      description: The identifiers of the tombstone revision.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteFileInput'
    Changeset:
      description: One atomic change of one or more files.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangesetInput'
    UploadAttachment:
      description: Multipart form upload that contains the binary attachment file.
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/UploadAttachmentInput'
    ImportWorkspace:
      description: Multipart form upload that contains one portable zip archive.
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/ImportWorkspaceInput'
    FinalizeAttachment:
      description: Payload to finalize an attachment and create an immutable revision.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FinalizeAttachmentInput'
    RestoreRevision:
      description: Revision restore payload.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestoreRevisionInput'
    PreviewPurge:
      description: Purge preview payload.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PreviewPurgeInput'
    PurgeFiles:
      description: File purge payload.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurgeFilesInput'
    RestoreFile:
      description: Deleted file restore payload.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestoreFileInput'
    StartSnapshot:
      description: Snapshot start payload.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StartSnapshotInput'
  responses:
    Health:
      description: The service process is running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReport'
    Readiness:
      description: The service can accept traffic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadinessReport'
    NotReady:
      description: The service cannot accept traffic yet.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: The request did not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServerError:
      description: The service failed to complete the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: The request carries no usable session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The actor may not perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PayloadTooLarge:
      description: The request body is larger than the configured limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: The request media type is not supported.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Too many attempts were made in a short time.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Account:
      description: The signed in account and its settings.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
    Preferences:
      description: The stored settings of the signed in account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Preferences'
    Workspace:
      description: One workspace of the signed in account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workspace'
    WorkspaceList:
      description: Every workspace of the signed in account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceList'
    Removed:
      description: The named record no longer exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Removed'
    Conflict:
      description: >-
        The change cannot be accepted next to the state that the workspace
        holds. The code names the reason: path_conflict for a path that another
        live file occupies, and mutation_reused for a mutation identity that
        was already used for another operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Gone:
      description: >-
        The file identifier was permanently purged. It can never be written
        again, so a late offline change must be recovered into a new file.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: >-
        An expected head does not match the accepted head. The fileIds member
        names every file that moved on, so the client can resolve them.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionRequired:
      description: >-
        The operation needs a precondition and the request carried none. Repeat
        the request with the entity tag of the head that was read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableContent:
      description: >-
        The request is well formed but its content cannot be accepted. The code
        names the reason: invalid_path, invalid_graph, or invalid_content.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotModified:
      description: >-
        The entity tag in the request names the current head, so the answer
        carries no body.
    File:
      description: One live file and the content of its accepted head.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceFile'
    FileList:
      description: One page of the live files of a workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceFileList'
    DeletedFileList:
      description: One page of the deleted files of a workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkspaceDeletedFileList'
    SearchResults:
      description: Accepted live notes that match the search query.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResults'
    BacklinkList:
      description: Live notes that link to one file path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BacklinkList'
    FileChange:
      description: The accepted revision and the outcome of its changeset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileChange'
    Revision:
      description: One immutable revision of a workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileRevision'
    AcceptedChangeset:
      description: The outcome of one accepted changeset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedChangeset'
    AttachmentUploaded:
      description: The uploaded temporary attachment object and its verified digest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AttachmentUploadResult'
    NoteMarkdown:
      description: The accepted head of one note as a Markdown file.
      headers:
        content-disposition:
          description: >-
            Names the download and asks the client to save it rather than to
            show it.
          schema:
            type: string
            maxLength: 512
      content:
        text/markdown:
          schema:
            type: string
            format: binary
    WorkspaceArchive:
      description: A zip archive of every live note and its attachments.
      headers:
        content-disposition:
          description: >-
            Names the download and asks the client to save it rather than to
            show it.
          schema:
            type: string
            maxLength: 512
      content:
        application/zip:
          schema:
            type: string
            format: binary
    WorkspaceImported:
      description: Counts of the files read from one portable archive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImportWorkspaceResult'
    AttachmentBinary:
      description: Binary bytes of the immutable attachment.
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
    HistoryPage:
      description: One page of file history revisions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HistoryPage'
    PurgePreview:
      description: Preview of permanent file purge.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurgePreview'
    PurgedFiles:
      description: Outcome of executed permanent file purge.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurgedFiles'
    SnapshotStarted:
      description: The captured snapshot and its opaque page token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SnapshotStarted'
    SnapshotPage:
      description: One page of the items that a snapshot captured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SnapshotPage'
    SyncChanges:
      description: Ordered incremental changes after a cursor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SyncChanges'
    SnapshotRequired:
      description: >-
        The snapshot expired, is unknown, was invalidated by a purge, or the
        sync cursor predates the retained 90 day window. The code is
        snapshot_required. The client starts a fresh snapshot and keeps its
        local work.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    HealthReport:
      type: object
      description: Liveness report of the service process.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          readOnly: true
          description: Always the literal value ok while the process answers.
          enum:
            - ok
    ReadinessReport:
      type: object
      description: Readiness report of every startup requirement.
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          readOnly: true
          description: >-
            Overall readiness. The value is degraded when at least one check is
            degraded.
          enum:
            - ok
            - degraded
        checks:
          type: array
          readOnly: true
          description: One entry for every startup requirement that was checked.
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    ReadinessCheck:
      type: object
      description: State of one startup requirement.
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          readOnly: true
          description: Stable name of the requirement, for example configuration.
          minLength: 1
          maxLength: 64
        status:
          type: string
          readOnly: true
          description: State of this requirement.
          enum:
            - ok
            - degraded
        detail:
          type: string
          readOnly: true
          description: >-
            Operator readable explanation. The field is absent in a summary
            report and it never contains note content or a secret.
          maxLength: 512
    ProblemDetails:
      type: object
      description: >-
        RFC 9457 problem details. The code field carries the stable application
        error code that a client can branch on.
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          readOnly: true
          description: Stable URI reference that identifies the problem type.
          format: uri-reference
          maxLength: 256
        title:
          type: string
          readOnly: true
          description: Short human readable summary of the problem type.
          maxLength: 256
        status:
          type: integer
          readOnly: true
          description: HTTP status code of this response.
          minimum: 100
          maximum: 599
        detail:
          type: string
          readOnly: true
          description: >-
            Explanation of this occurrence. The field never contains note
            content, a secret, or a stack trace.
          maxLength: 1024
        instance:
          type: string
          readOnly: true
          description: URI reference of the request that produced the problem.
          format: uri-reference
          maxLength: 1024
        code:
          type: string
          readOnly: true
          description: Stable application error code.
          pattern: ^[a-z][a-z0-9_]*$
          maxLength: 64
        requestId:
          type: string
          readOnly: true
          description: Identifier of the request, repeated in the x-request-id header.
          minLength: 1
          maxLength: 128
        issues:
          type: array
          readOnly: true
          description: >-
            Values that a boundary check rejected. Each entry names the value by
            JSON Pointer and never repeats the value itself.
          maxItems: 64
          items:
            $ref: '#/components/schemas/ValidationIssue'
        fileIds:
          type: array
          readOnly: true
          description: >-
            The files that a content failure refers to, for example every file
            whose accepted head moved on. The list is absent when the failure
            names no file. It carries identifiers only, never a path or note
            content.
          maxItems: 4000
          items:
            $ref: '#/components/schemas/Uuid'
    ValidationIssue:
      type: object
      description: One value that a boundary check rejected.
      additionalProperties: false
      required:
        - path
        - message
      properties:
        path:
          type: string
          readOnly: true
          description: JSON Pointer of the rejected value inside its request slot.
          maxLength: 256
        message:
          type: string
          readOnly: true
          description: Reason the value was rejected. It never repeats the value.
          maxLength: 256
    Uuid:
      type: string
      description: A UUID that names one record.
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    Appearance:
      type: string
      description: >-
        Appearance choice. The value system follows the device preference
        between the light and the dark variant of the chosen theme family.
      enum:
        - system
        - light
        - dark
    ThemeFamily:
      type: string
      description: >-
        Identifier of a theme family in the client theme registry, for example
        tokyo-night. An identifier that the client does not know falls back to
        the default family, so a stored value never stops the page painting.
      minLength: 1
      maxLength: 40
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    Role:
      type: string
      description: >-
        Workspace access role. This product serves one person, so the only
        role is owner. The field stays, because stored rows and the
        permission matrix name it.
      enum:
        - owner
    Preferences:
      type: object
      description: Settings that follow one account to every device.
      additionalProperties: false
      required:
        - appearance
        - themeFamily
      properties:
        appearance:
          allOf:
            - $ref: '#/components/schemas/Appearance'
          readOnly: true
          description: The stored appearance choice of the account.
        themeFamily:
          allOf:
            - $ref: '#/components/schemas/ThemeFamily'
          readOnly: true
          description: The stored theme family of the account.
    PreferencesInput:
      type: object
      description: Settings to store for the signed in account.
      additionalProperties: false
      required:
        - appearance
        - themeFamily
      properties:
        appearance:
          allOf:
            - $ref: '#/components/schemas/Appearance'
          description: The appearance choice to store.
        themeFamily:
          allOf:
            - $ref: '#/components/schemas/ThemeFamily'
          description: The theme family to store.
    Account:
      type: object
      description: The signed in account and its settings.
      additionalProperties: false
      required:
        - accountId
        - preferences
      properties:
        accountId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Stable identifier of the account inside this deployment.
        email:
          type:
            - string
            - 'null'
          readOnly: true
          description: Sign-in address, or null when no address is linked.
          maxLength: 320
        name:
          type:
            - string
            - 'null'
          readOnly: true
          description: Display name, or null when no name is stored.
          maxLength: 256
        preferences:
          allOf:
            - $ref: '#/components/schemas/Preferences'
          readOnly: true
          description: The stored settings of the account.
    Workspace:
      type: object
      description: One workspace as its member sees it.
      additionalProperties: false
      required:
        - workspaceId
        - name
        - role
        - personal
      properties:
        workspaceId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Identifier of the workspace.
        name:
          type: string
          readOnly: true
          description: Name of the workspace.
          minLength: 1
          maxLength: 200
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          readOnly: true
          description: The role of the reading account in this workspace.
        personal:
          type: boolean
          readOnly: true
          description: True for the workspace that was created with the account.
    WorkspaceList:
      type: object
      description: Every workspace of the signed in account.
      additionalProperties: false
      required:
        - workspaces
      properties:
        workspaces:
          type: array
          readOnly: true
          description: One entry for each workspace the account belongs to.
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Workspace'
    WorkspaceNameInput:
      type: object
      description: The name to give a workspace.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the workspace.
          minLength: 1
          maxLength: 200
    Removed:
      type: object
      description: Confirmation that the named record no longer exists.
      additionalProperties: false
      required:
        - removed
      properties:
        removed:
          type: boolean
          readOnly: true
          description: Always true. The record no longer exists.
    FileKind:
      type: string
      description: Whether a file holds Markdown or an attachment.
      enum:
        - note
        - attachment
    EntityTagCondition:
      type: string
      description: >-
        A conditional request header value: either the literal *, or one or
        more entity tags separated by commas. A tag is quoted, and a weak tag
        carries the W/ prefix. A write compares strongly, as RFC 9110 requires,
        so it accepts a strong tag only.
      minLength: 1
      maxLength: 1024
      pattern: ^(?:\*|(?:W/)?"[^"]*"(?:[ \t]*,[ \t]*(?:W/)?"[^"]*")*)$
    ContentDigest:
      type: string
      description: >-
        The SHA-256 digest of the content, in lower case hexadecimal. Content
        is addressed by this value, so it is verified against the bytes before
        a revision is accepted.
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-f]{64}$
    MarkdownText:
      type: string
      description: >-
        The Markdown source of one revision. It is stored and returned exactly
        as it was written, without normalization.
      maxLength: 1048576
    FilePath:
      type: string
      description: >-
        Relative POSIX path of the file inside its workspace. A note path ends
        in .md. The stored path is the Unicode NFC form of this value, and it
        is compared case sensitively.
      minLength: 1
      maxLength: 1024
    DeviceId:
      type: string
      description: >-
        The device that submitted the change. It is informational and appears
        in the history of the workspace.
      minLength: 1
      maxLength: 128
    CheckpointMessage:
      type:
        - string
        - 'null'
      description: >-
        Name of a checkpoint, or null for an ordinary revision. It is written
        by the author and is not interpreted by the server.
      maxLength: 512
    FileSortOrder:
      type: string
      description: >-
        Order of a file listing. `updated` is the newest accepted change
        first. `path` is the stored path in ascending order.
      enum:
        - updated
        - path
    FilePageToken:
      type: string
      description: >-
        Opaque position inside one file listing. It belongs to the sort that
        produced it and carries no meaning for a client.
      minLength: 1
      maxLength: 2048
      pattern: '^(updated|path)\.[0-9a-fA-F-]{36}\.[A-Za-z0-9\-._~!*''()%]*$'
    WorkspaceFileSummary:
      type: object
      description: One live file of a workspace, without its content.
      additionalProperties: false
      required:
        - fileId
        - path
        - kind
        - headRevisionId
        - createdAt
        - updatedAt
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Stable identifier of the file. A rename never changes it.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
          description: The accepted path of the file.
        kind:
          allOf:
            - $ref: '#/components/schemas/FileKind'
          readOnly: true
          description: Whether the file holds Markdown or an attachment.
        headRevisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          readOnly: true
          description: >-
            The accepted head of the file, which is also its entity tag, or
            null for a file that has no accepted revision yet.
        createdAt:
          type: string
          readOnly: true
          description: Instant at which the file was created.
          format: date-time
          maxLength: 64
        updatedAt:
          type: string
          readOnly: true
          description: Instant at which the workspace accepted the last change.
          format: date-time
          maxLength: 64
    WorkspaceFileList:
      type: object
      description: One page of the live files of a workspace.
      additionalProperties: false
      required:
        - files
        - nextCursor
      properties:
        files:
          type: array
          readOnly: true
          description: The files of this page, in the requested order.
          maxItems: 500
          items:
            $ref: '#/components/schemas/WorkspaceFileSummary'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/FilePageToken'
            - type: 'null'
          readOnly: true
          description: >-
            Cursor of the next page, or null when this page is the last one.
            It continues the sort that produced it.
    WorkspaceDeletedFileSummary:
      type: object
      description: One deleted file of a workspace, without its content.
      additionalProperties: false
      required:
        - fileId
        - path
        - kind
        - headRevisionId
        - createdAt
        - deletedAt
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Stable identifier of the file. A rename never changes it.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
          description: The path that the file held when it was deleted.
        kind:
          allOf:
            - $ref: '#/components/schemas/FileKind'
          readOnly: true
          description: Whether the file holds Markdown or an attachment.
        headRevisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: >-
            The tombstone revision that deleted the file, which is its accepted
            head and its entity tag. A restore states it as the expected head.
        createdAt:
          type: string
          readOnly: true
          description: Instant at which the file was created.
          format: date-time
          maxLength: 64
        deletedAt:
          type: string
          readOnly: true
          description: Instant at which the workspace accepted the deletion.
          format: date-time
          maxLength: 64
    WorkspaceDeletedFileList:
      type: object
      description: One page of the deleted files of a workspace.
      additionalProperties: false
      required:
        - files
        - nextCursor
      properties:
        files:
          type: array
          readOnly: true
          description: The deleted files of this page, in the requested order.
          maxItems: 500
          items:
            $ref: '#/components/schemas/WorkspaceDeletedFileSummary'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/FilePageToken'
            - type: 'null'
          readOnly: true
          description: >-
            Cursor of the next page, or null when this page is the last one.
            It continues the sort that produced it.
    SearchExcerptPart:
      type: object
      description: >-
        One part of a search excerpt. A part with `marked` true is a word that
        the query matched. The excerpt carries no markup, so a reader renders
        every part as text and decides itself how a marked part looks.
      additionalProperties: false
      required:
        - text
        - marked
      properties:
        text:
          type: string
          readOnly: true
          maxLength: 1024
        marked:
          type: boolean
          readOnly: true
    SearchHit:
      type: object
      description: One accepted live note that matched a search.
      additionalProperties: false
      required:
        - fileId
        - path
        - revisionId
        - excerpt
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
        excerpt:
          type: array
          readOnly: true
          description: The matching part of the note, in reading order.
          maxItems: 128
          items:
            $ref: '#/components/schemas/SearchExcerptPart'
    SearchResults:
      type: object
      description: Search results from current accepted note revisions.
      additionalProperties: false
      required:
        - hits
      properties:
        hits:
          type: array
          readOnly: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/SearchHit'
    Backlink:
      type: object
      description: One live note that links to the requested file path.
      additionalProperties: false
      required:
        - fileId
        - path
        - revisionId
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
    BacklinkList:
      type: object
      description: Live notes that link to one current file path.
      additionalProperties: false
      required:
        - backlinks
      properties:
        backlinks:
          type: array
          readOnly: true
          maxItems: 100
          items:
            $ref: '#/components/schemas/Backlink'
    WorkspaceFile:
      type: object
      description: One live file and the content of its accepted head.
      additionalProperties: false
      required:
        - fileId
        - path
        - kind
        - headRevisionId
        - createdAt
        - updatedAt
        - head
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Stable identifier of the file.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
          description: The accepted path of the file.
        kind:
          allOf:
            - $ref: '#/components/schemas/FileKind'
          readOnly: true
          description: Whether the file holds Markdown or an attachment.
        headRevisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          readOnly: true
          description: The accepted head, which is also the entity tag.
        createdAt:
          type: string
          readOnly: true
          description: Instant at which the file was created.
          format: date-time
          maxLength: 64
        updatedAt:
          type: string
          readOnly: true
          description: Instant at which the workspace accepted the last change.
          format: date-time
          maxLength: 64
        head:
          oneOf:
            - $ref: '#/components/schemas/FileRevision'
            - type: 'null'
          readOnly: true
          description: >-
            The head revision with its content, or null for a file that has no
            accepted revision yet.
    FileRevision:
      type: object
      description: >-
        One immutable revision. Its identity, its parents, and its content
        never change after acceptance.
      additionalProperties: false
      required:
        - revisionId
        - fileId
        - path
        - kind
        - deleted
        - parents
        - digest
        - size
        - text
        - attachmentObjectId
        - message
        - restoredFrom
        - clientTime
        - serverTime
      properties:
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Identifier of this revision.
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: The file that this revision belongs to.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
          description: The path of the file at this revision.
        kind:
          allOf:
            - $ref: '#/components/schemas/FileKind'
          readOnly: true
          description: Whether this revision holds Markdown or an attachment.
        deleted:
          type: boolean
          readOnly: true
          description: True for a tombstone, which is how a deletion is recorded.
        parents:
          type: array
          readOnly: true
          description: >-
            The parents of this revision, in submitted order. A first revision
            has none, a normal revision has one, and an explicit merge has two.
          maxItems: 2
          items:
            $ref: '#/components/schemas/Uuid'
        digest:
          allOf:
            - $ref: '#/components/schemas/ContentDigest'
          readOnly: true
          description: Digest of the content of this revision.
        size:
          type: integer
          readOnly: true
          description: Size of the content in bytes.
          minimum: 0
        text:
          oneOf:
            - $ref: '#/components/schemas/MarkdownText'
            - type: 'null'
          readOnly: true
          description: >-
            The Markdown of this revision, or null for an attachment revision.
        attachmentObjectId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          readOnly: true
          description: >-
            The immutable attachment object of this revision, or null for a
            Markdown revision. Its bytes are transferred separately.
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          readOnly: true
          description: The checkpoint name of this revision, or null.
        restoredFrom:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          readOnly: true
          description: >-
            The historic revision that this one restored, or null. A restore
            never rewinds history; it adds a revision.
        clientTime:
          type: string
          readOnly: true
          description: >-
            The clock of the device that wrote the revision. It stays
            informational, because a device clock cannot be trusted.
          format: date-time
          maxLength: 64
        serverTime:
          type: string
          readOnly: true
          description: Instant at which the workspace accepted the revision.
          format: date-time
          maxLength: 64
    AcceptedRevision:
      type: object
      description: >-
        One revision as the workspace accepted it. The record carries the
        values that the workspace assigned, and no note text: the client that
        wrote the revision already holds its content, and an actor that may
        write but not read must not receive content through a write answer.
      additionalProperties: false
      required:
        - revisionId
        - fileId
        - parents
        - path
        - deleted
        - digest
        - size
        - actorAccountId
        - serverTime
        - message
      properties:
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: Identifier of the accepted revision.
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: The file that the revision belongs to.
        parents:
          type: array
          readOnly: true
          description: The parents of the revision, in submitted order.
          maxItems: 2
          items:
            $ref: '#/components/schemas/Uuid'
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          readOnly: true
          description: The accepted path, in its normalized form.
        deleted:
          type: boolean
          readOnly: true
          description: True for a tombstone, which is how a deletion is recorded.
        digest:
          allOf:
            - $ref: '#/components/schemas/ContentDigest'
          readOnly: true
          description: Digest of the content of the revision.
        size:
          type: integer
          readOnly: true
          description: Size of the content in bytes.
          minimum: 0
        actorAccountId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: >-
            The account that the workspace recorded as the author. It comes
            from the verified request; a client cannot supply it.
        serverTime:
          type: string
          readOnly: true
          description: Instant at which the workspace accepted the revision.
          format: date-time
          maxLength: 64
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          readOnly: true
          description: The checkpoint name of the revision, or null.
    SupersededHead:
      type: object
      description: >-
        One file whose accepted head moved between the read of the client and
        this changeset. The workspace rebased the save on the current head, so
        the later save still wins and the head that it passed stays in history.
        The record carries no text and no path: the accepted revision of the
        same answer already names the path.
      additionalProperties: false
      required:
        - fileId
        - previousHeadRevisionId
        - acceptedRevisionId
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: The file whose accepted head moved.
        previousHeadRevisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: >-
            The accepted head that the client did not see. It is now a history
            entry of the file, and its text is not lost.
        acceptedRevisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: >-
            The revision of this changeset that became the new accepted head
            of the file.
    AcceptedChangeset:
      type: object
      description: The outcome of one accepted changeset.
      additionalProperties: false
      required:
        - mutationId
        - revisionIds
        - cursor
        - revisions
        - superseded
      properties:
        mutationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          readOnly: true
          description: The mutation identity that the client submitted.
        revisionIds:
          type: array
          readOnly: true
          description: >-
            Every revision that this changeset accepted, in submitted order. A
            retry of the same mutation returns exactly these identifiers again.
          minItems: 1
          maxItems: 4000
          items:
            $ref: '#/components/schemas/Uuid'
        cursor:
          type: string
          readOnly: true
          description: >-
            The commit ordered position of this change in the workspace. A sync
            client asks for changes after a cursor it already applied.
          minLength: 1
          maxLength: 32
          pattern: ^[0-9]+$
        revisions:
          type: array
          readOnly: true
          description: >-
            Every accepted revision with the values that the workspace
            assigned. A client applies these without reading the workspace
            again, and a retry of the same mutation repeats them.
          minItems: 1
          maxItems: 4000
          items:
            $ref: '#/components/schemas/AcceptedRevision'
        superseded:
          type: array
          readOnly: true
          description: >-
            Every file whose accepted head this changeset rebased, empty for
            the normal case. A client shows the person that a save from
            another device is now only in the history of the file.
          maxItems: 4000
          items:
            $ref: '#/components/schemas/SupersededHead'
    FileChange:
      type: object
      description: The revision that one single file operation accepted.
      additionalProperties: false
      required:
        - revision
        - accepted
      properties:
        revision:
          allOf:
            - $ref: '#/components/schemas/AcceptedRevision'
          readOnly: true
          description: >-
            The accepted revision, as the workspace recorded it. Its identifier
            is the entity tag of the answer. It carries no text: the request
            that wrote it already holds the content.
        accepted:
          allOf:
            - $ref: '#/components/schemas/AcceptedChangeset'
          readOnly: true
          description: The outcome of the changeset that carried the revision.
    CreateFileInput:
      type: object
      description: The identifiers, the path, and the first content of a new file.
      additionalProperties: false
      required:
        - fileId
        - revisionId
        - mutationId
        - deviceId
        - path
        - text
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: >-
            Identifier of the new file. The client assigns it, so a file that
            was written offline keeps one identity everywhere.
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the first revision.
        mutationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: >-
            Identity of this operation. A retry that repeats it returns the
            first outcome instead of writing a second time.
        deviceId:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: The device that submitted the change.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          description: Path of the new note, which must end in .md.
        text:
          allOf:
            - $ref: '#/components/schemas/MarkdownText'
          description: Markdown of the first revision.
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          description: Name of this checkpoint, or null.
    UpdateFileInput:
      type: object
      description: The identifiers and the new content or path of a file.
      additionalProperties: false
      required:
        - revisionId
        - mutationId
        - deviceId
      properties:
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the new revision.
        mutationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identity of this operation, which makes a retry safe.
        deviceId:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: The device that submitted the change.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          description: >-
            New path of the file. The path of the expected head is kept when
            this member is absent.
        text:
          allOf:
            - $ref: '#/components/schemas/MarkdownText'
          description: >-
            New Markdown of the file. The content of the expected head is kept
            when this member is absent, which is how a plain rename is written.
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          description: Name of this checkpoint, or null.
    DeleteFileInput:
      type: object
      description: The identifiers of a tombstone revision.
      additionalProperties: false
      required:
        - revisionId
        - mutationId
        - deviceId
      properties:
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the tombstone revision.
        mutationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identity of this operation, which makes a retry safe.
        deviceId:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: The device that submitted the deletion.
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          description: Reason for the deletion, or null.
    ContentInput:
      type: object
      description: >-
        The immutable content of one submitted revision. Markdown carries its
        text; an attachment names a finalized object of the same workspace.
      additionalProperties: false
      required:
        - kind
        - digest
      properties:
        kind:
          type: string
          description: Which of the two content forms this revision carries.
          enum:
            - markdown
            - attachment
        digest:
          allOf:
            - $ref: '#/components/schemas/ContentDigest'
          description: >-
            Digest of the content. The server recomputes it from the submitted
            bytes and refuses a revision that declares another value.
        text:
          allOf:
            - $ref: '#/components/schemas/MarkdownText'
          description: The Markdown of this revision. Absent for an attachment.
        attachmentObjectId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: >-
            The finalized attachment object of this revision. Absent for
            Markdown.
    RevisionInput:
      type: object
      description: One revision that a client submits inside a changeset.
      additionalProperties: false
      required:
        - revisionId
        - fileId
        - parents
        - path
        - deleted
        - content
        - clientTime
      properties:
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier that the client assigned to this revision.
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: The file that this revision belongs to.
        parents:
          type: array
          description: >-
            The parents of this revision. A parent is either an earlier
            revision of the same file in this submission or an accepted
            revision of that file.
          maxItems: 2
          items:
            $ref: '#/components/schemas/Uuid'
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          description: The path that the file has after this revision.
        deleted:
          type: boolean
          description: True for a tombstone, which records a deletion.
        content:
          allOf:
            - $ref: '#/components/schemas/ContentInput'
          description: The content of this revision.
        clientTime:
          type: string
          description: The device clock at the moment of the change.
          format: date-time
          minLength: 20
          maxLength: 64
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          description: Name of this checkpoint, or null.
        restoredFrom:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The historic revision that this one restores, or null.
    ExpectedHeads:
      type: object
      description: >-
        The accepted head that the client saw for each file of the changeset,
        keyed by file identifier. The value null states that the file must not
        exist in accepted state, which is the precondition of a new file. Every
        file that the changeset changes needs an entry, and an entry for a file
        that it does not change is refused. The limit below is a coarse bound
        that protects the parser; the rule that a changeset may change at most
        1000 files is applied by the workspace and answers 422.
      maxProperties: 4000
      propertyNames:
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      additionalProperties:
        oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    ChangesetInput:
      type: object
      description: One atomic change of one or more files.
      additionalProperties: false
      required:
        - mutationId
        - deviceId
        - expectedHeads
        - revisions
      properties:
        mutationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: >-
            Identity of this operation. A retry with the same identity and the
            same body returns the first outcome.
        deviceId:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: The device that submitted the changeset.
        expectedHeads:
          allOf:
            - $ref: '#/components/schemas/ExpectedHeads'
          description: The precondition of every file that the changeset changes.
        revisions:
          type: array
          description: >-
            The revisions to accept, in submission order. The revisions of one
            file form one chain, and the last one becomes its head. One
            changeset may change at most 1000 files, and a file may carry
            several revisions, so the limit below is above the file limit.
          minItems: 1
          maxItems: 4000
          items:
            $ref: '#/components/schemas/RevisionInput'
    UploadAttachmentInput:
      type: object
      description: Multipart form upload payload that contains the binary attachment file.
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Binary bytes of the image attachment.
    ImportWorkspaceInput:
      type: object
      description: Multipart form upload payload that contains one zip archive.
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Portable workspace zip archive.
    ImportWorkspaceResult:
      type: object
      description: Counts of files imported without reference translation.
      additionalProperties: false
      required:
        - notes
        - attachments
      properties:
        notes:
          type: integer
          minimum: 0
        attachments:
          type: integer
          minimum: 0
    AttachmentUploadResult:
      type: object
      description: The uploaded temporary attachment object and its verified digest.
      additionalProperties: false
      required:
        - objectId
        - digest
        - size
        - mediaType
        - width
        - height
      properties:
        objectId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Unique identifier of the uploaded attachment object.
        digest:
          allOf:
            - $ref: '#/components/schemas/ContentDigest'
          description: SHA-256 digest of the validated image bytes.
        size:
          type: integer
          minimum: 1
          description: Size of the attachment in bytes.
        mediaType:
          type: string
          description: Validated MIME type of the uploaded image.
          enum:
            - image/png
            - image/jpeg
            - image/gif
            - image/webp
        width:
          type: integer
          minimum: 1
          description: Width of the image in pixels.
        height:
          type: integer
          minimum: 1
          description: Height of the image in pixels.
    FinalizeAttachmentInput:
      type: object
      description: Payload to finalize an attachment and create an immutable revision.
      additionalProperties: false
      required:
        - fileId
        - revisionId
        - mutationId
        - deviceId
        - path
        - digest
      properties:
        fileId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the file that holds this attachment revision.
        revisionId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identifier of the new revision.
        mutationId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Identity of this operation, which makes a retry safe.
        deviceId:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: The device that submitted the change.
        path:
          allOf:
            - $ref: '#/components/schemas/FilePath'
          description: Path of the attachment file in the workspace.
        digest:
          allOf:
            - $ref: '#/components/schemas/ContentDigest'
          description: The verified SHA-256 digest of the attachment object.
        message:
          allOf:
            - $ref: '#/components/schemas/CheckpointMessage'
          description: Name of this checkpoint, or null.
    HistoryRevisionItem:
      type: object
      description: One historic revision of a file.
      additionalProperties: false
      required:
        - revisionId
        - fileId
        - path
        - deleted
        - parents
        - digest
        - size
