        - purgedFileIds
        - purgedRevisionIds
        - reclaimedBytes
      properties:
        mutationId:
          $ref: '#/components/schemas/Uuid'
        purgedFileIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        purgedRevisionIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        reclaimedBytes:
          type: integer
    StartSnapshotInput:
      type: object
      description: Snapshot start payload.
      additionalProperties: false
      required:
        - syncVersion
      properties:
        syncVersion:
          type: integer
          description: >-
            Sync protocol version of the client. Only version 1 is served; any
            other value is rejected without changing data.
          enum:
            - 1
        pageSize:
          type: integer
          description: >-
            Largest number of snapshot items in one page. The server uses 100
            when the value is absent and never stores more than 500.
          minimum: 1
          maximum: 500
    SnapshotItem:
      type: object
      description: >-
        One pinned file of a snapshot. The revision identifier is immutable, so
        a later commit cannot change what a page shows.
      additionalProperties: false
      required:
        - fileId
        - revisionId
        - path
        - kind
        - deleted
      properties:
        fileId:
          $ref: '#/components/schemas/Uuid'
        revisionId:
          $ref: '#/components/schemas/Uuid'
        path:
          $ref: '#/components/schemas/FilePath'
        kind:
          type: string
          readOnly: true
          description: Whether the file holds Markdown or an attachment.
          enum:
            - note
            - attachment
        deleted:
          type: boolean
          readOnly: true
          description: Whether the file was deleted when captured. Always false.
    SnapshotStarted:
      type: object
      description: The captured snapshot and its opaque page token.
      additionalProperties: false
      required:
        - token
        - expiresAt
        - cursor
        - itemCount
        - pageSize
      properties:
        token:
          type: string
          readOnly: true
          description: >-
            Opaque token that addresses the materialized pages for 15 minutes.
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        expiresAt:
          type: string
          readOnly: true
          description: Instant at which the snapshot expires.
          format: date-time
        cursor:
          type: string
          readOnly: true
          description: >-
            The captured high-water cursor. A sync client asks for changes
            after this position.
          minLength: 1
          maxLength: 32
          pattern: ^[0-9]+$
        itemCount:
          type: integer
          readOnly: true
          description: How many items the snapshot captured.
          minimum: 0
        pageSize:
          type: integer
          readOnly: true
          description: The page size stored with the snapshot.
          minimum: 1
          maximum: 500
    SnapshotPage:
      type: object
      description: One page of the items that a snapshot captured.
      additionalProperties: false
      required:
        - token
        - cursor
        - expiresAt
        - position
        - nextPosition
        - totalItems
        - items
      properties:
        token:
          type: string
          readOnly: true
          description: The token of the snapshot, echoed for the client.
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        cursor:
          type: string
          readOnly: true
          description: The captured high-water cursor.
          minLength: 1
          maxLength: 32
          pattern: ^[0-9]+$
        expiresAt:
          type: string
          readOnly: true
          description: Instant at which the snapshot expires.
          format: date-time
        position:
          type: integer
          readOnly: true
          description: Ordinal of the first item of this page.
          minimum: 0
        nextPosition:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
          readOnly: true
          description: Ordinal of the next page, or null on the last page.
        totalItems:
          type: integer
          readOnly: true
          description: How many items the snapshot holds now.
          minimum: 0
        items:
          type: array
          readOnly: true
          description: The captured items of this page, ordered by file.
          maxItems: 500
          items:
            $ref: '#/components/schemas/SnapshotItem'
    SyncChangeItem:
      type: object
      description: One commit ordered incremental change record.
      additionalProperties: false
      required:
        - cursor
        - entityKind
        - entityId
        - revisionId
        - deleted
      properties:
        cursor:
          type: string
          readOnly: true
          description: The commit ordered position of this change.
          minLength: 1
          maxLength: 32
          pattern: ^[0-9]+$
        entityKind:
          type: string
          readOnly: true
          description: The kind of entity that the record refers to.
          enum:
            - file
            - membership
        entityId:
          $ref: '#/components/schemas/Uuid'
        revisionId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          readOnly: true
          description: The revision of a file change, or null otherwise.
        deleted:
          type: boolean
          readOnly: true
          description: Whether the change deletes its entity.
    SyncChanges:
      type: object
      description: Ordered incremental changes after a cursor.
      additionalProperties: false
      required:
        - changes
        - nextCursor
      properties:
        changes:
          type: array
          readOnly: true
          description: Ordered changes after the requested cursor, oldest first.
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncChangeItem'
        nextCursor:
          type: string
          readOnly: true
          description: The cursor the client sends to continue.
          minLength: 1
          maxLength: 32
          pattern: ^[0-9]+$
