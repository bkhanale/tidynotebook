        deviceId:
          $ref: '#/components/schemas/DeviceId'
        clientTime:
          type: string
          format: date-time
          minLength: 20
          maxLength: 64
        revisionId:
          $ref: '#/components/schemas/Uuid'
    PreviewPurgeInput:
