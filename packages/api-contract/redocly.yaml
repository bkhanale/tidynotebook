# Strict specification checks for the notesapp contract.
extends:
  - recommended-strict
rules:
  struct: error
  no-unresolved-refs: error
  security-defined: error
# The rules below read an OpenAPI operation, so they apply to `openapi.yaml`
# only. `asyncapi.yaml` takes the rules above and the strict AsyncAPI set.
oas3_1Rules:
  # Off, and the check is not lost. The contract source is a root document
  # beside one file for each path item and each component, so the root declares
  # every component as a reference to its file. This rule counts that reference
  # as a use, so it can report nothing and it proves nothing here.
  # `tools/sdk-codegen/src/orphans.ts` holds the check instead. It walks the
  # bundled document from the paths and the document security, and it also
  # sees the authentication fragment that the generator merges, which this rule
  # never read. `pnpm generate` and `pnpm generated:check` both run it.
  no-unused-components: off
  operation-operationId: error
  operation-operationId-unique: error
  operation-operationId-url-safe: error
  operation-summary: error
  operation-description: error
  operation-2xx-response: error
  operation-4xx-response: error
  operation-tag-defined: error
  operation-singular-tag: error
  parameter-description: error
  path-parameters-defined: error
  no-ambiguous-paths: error
  no-identical-paths: error
  no-invalid-parameter-examples: error
  no-invalid-media-type-examples: error
  no-http-verbs-in-paths: error
  spec-strict-refs: error
  response-contains-property: off
  operation-4xx-problem-details-rfc7807: error
